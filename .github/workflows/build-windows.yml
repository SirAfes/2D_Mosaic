name: build-windows

# Builds mosaic2d.exe (with the window) on a Windows machine.
#  - every push of a version tag (v0.3.0, v0.4.0, ...) → zip attached to a GitHub Release
#  - code pushed to main → zip on the run page, and attached to the release of the
#    current version if that release already exists (replaces the old zip)
#  - "Run workflow" button on the Actions tab → zip downloadable from the run page

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["src/**", "packaging/**", "pyproject.toml", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,view]" "pyinstaller>=6.11" "pyinstaller-hooks-contrib>=2024.10"

      - name: Tests
        run: python -m pytest -q

      - name: Build mosaic2d.exe
        run: >
          pyinstaller --noconfirm --clean --console --name mosaic2d
          --paths src
          --collect-submodules mosaic2d
          --collect-submodules numpy
          --collect-submodules imagecodecs
          --hidden-import tkinter
          packaging/mosaic2d_exe.py

      - name: Check the executable
        shell: pwsh
        run: |
          $exe = "dist\mosaic2d\mosaic2d.exe"
          & $exe --version; if ($LASTEXITCODE) { exit 1 }
          & $exe methods; if ($LASTEXITCODE) { exit 1 }
          & $exe gui --selftest; if ($LASTEXITCODE) { exit 1 }
          # the double-click path (no arguments), window closed at once
          $env:MOSAIC2D_GUI_SELFTEST = "1"
          $t = Measure-Command { & $exe | Out-Host }
          Remove-Item Env:MOSAIC2D_GUI_SELFTEST
          if ($LASTEXITCODE) { exit 1 }
          "double-click start-up: $([int]$t.TotalSeconds) s"
          python packaging/make_smoke_data.py smoke\src
          & $exe run smoke\src -o smoke\out --resolution 0.5 --no-cache; if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path smoke\out\mosaic.tif)) { Write-Error "no mosaic written"; exit 1 }
          & $exe view smoke\out\mosaic.tif --selftest; if ($LASTEXITCODE) { exit 1 }

      - name: Zip
        shell: pwsh
        run: |
          $v = (& dist\mosaic2d\mosaic2d.exe --version).Trim()
          Copy-Item README.md, LICENSE, CHANGELOG.md dist\mosaic2d\
          Compress-Archive -Path dist\mosaic2d -DestinationPath "mosaic2d-$v-windows-x64.zip"
          "ZIP=mosaic2d-$v-windows-x64.zip" | Out-File -Append $env:GITHUB_ENV
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: mosaic2d-windows-x64
          path: ${{ env.ZIP }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true

      - name: Attach to the existing release of this version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$env:VERSION" "$env:ZIP" --clobber --repo "${{ github.repository }}"
          } else {
            "No release v$env:VERSION yet; the zip is on this run's page."
            $global:LASTEXITCODE = 0
          }
